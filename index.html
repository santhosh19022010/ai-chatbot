<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chatbot Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkBg: '#09090b',
                        panelBg: '#121216',
                        accent: '#6366f1'
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-darkBg text-zinc-100 h-screen flex flex-col justify-between font-sans">

    <!-- Header -->
    <header class="border-b border-zinc-800/60 bg-darkBg/80 backdrop-blur-md px-6 py-4 flex items-center justify-between">
        <div class="flex items-center space-x-3">
            <div class="w-3 h-3 rounded-full bg-emerald-500 animate-pulse"></div>
            <h1 class="font-bold text-lg tracking-tight text-white">Gemini AI Assistant</h1>
        </div>
        <span class="text-xs text-zinc-400 bg-zinc-900 border border-zinc-800 px-3 py-1 rounded-full">Free Web App</span>
    </header>

    <!-- Chat Box Container -->
    <main id="chat-container" class="flex-1 overflow-y-auto p-4 md:p-6 space-y-6 max-w-4xl w-full mx-auto">
        <div class="flex items-start space-x-3">
            <div class="w-8 h-8 rounded-full bg-accent flex items-center justify-center text-white font-bold text-xs shrink-0">AI</div>
            <div class="bg-zinc-900 border border-zinc-800/80 rounded-2xl p-4 text-sm text-zinc-300 max-w-[80%] leading-relaxed">
                Hello! I am your professional AI assistant. Ask me anything or tell me how I can help you today.
            </div>
        </div>
    </main>

    <!-- Input Form Footer -->
    <footer class="border-t border-zinc-800/60 bg-darkBg/80 backdrop-blur-md p-4">
        <form id="chat-form" class="max-w-4xl mx-auto flex gap-3">
            <input 
                type="text" 
                id="user-input" 
                placeholder="Type your message here..." 
                required
                autocomplete="off"
                class="flex-1 bg-zinc-900 border border-zinc-800 focus:border-accent text-zinc-100 placeholder-zinc-500 px-4 py-3 rounded-xl text-sm focus:outline-none transition-all"
            >
            <button 
                type="submit" 
                id="send-btn"
                class="bg-accent hover:bg-accent/90 text-white font-medium px-6 py-3 rounded-xl text-sm transition-all shadow-lg shadow-accent/20 flex items-center justify-center"
            >
                Send
            </button>
        </form>
    </footer>

    <script>
        const chatContainer = document.getElementById('chat-container');
        const chatForm = document.getElementById('chat-form');
        const userInput = document.getElementById('user-input');

        chatForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const message = userInput.value.trim();
            if (!message) return;

            appendMessage(message, 'user');
            userInput.value = '';
            userInput.disabled = true;

            const loadingId = appendLoadingIndicator();

            try {
                const response = await fetch('/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message })
                });
                const data = await response.json();
                
                document.getElementById(loadingId).remove();
                appendMessage(data.reply, 'bot');
            } catch (err) {
                document.getElementById(loadingId).remove();
                appendMessage("Network error. Please try again.", 'bot');
            } finally {
                userInput.disabled = false;
                userInput.focus();
            }
        });

        function appendMessage(text, sender) {
            const isUser = sender === 'user';
            const wrapper = document.createElement('div');
            wrapper.className = `flex items-start space-x-3 ${isUser ? 'flex-row-reverse space-x-reverse' : ''}`;
            
            wrapper.innerHTML = `
                <div class="w-8 h-8 rounded-full ${isUser ? 'bg-zinc-700' : 'bg-accent'} flex items-center justify-center text-white font-bold text-xs shrink-0">
                    ${isUser ? 'YOU' : 'AI'}
                </div>
                <div class="${isUser ? 'bg-indigo-600 text-white' : 'bg-zinc-900 border border-zinc-800/80 text-zinc-200'} rounded-2xl p-4 text-sm max-w-[80%] leading-relaxed">
                    ${escapeHtml(text)}
                </div>
            `;
            chatContainer.appendChild(wrapper);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function appendLoadingIndicator() {
            const id = 'loading-' + Date.now();
            const wrapper = document.createElement('div');
            wrapper.id = id;
            wrapper.className = 'flex items-start space-x-3';
            wrapper.innerHTML = `
                <div class="w-8 h-8 rounded-full bg-accent flex items-center justify-center text-white font-bold text-xs shrink-0">AI</div>
                <div class="bg-zinc-900 border border-zinc-800/80 rounded-2xl p-4 text-sm text-zinc-400 flex items-center space-x-2">
                    <span class="w-2 h-2 bg-accent rounded-full animate-bounce"></span>
                    <span class="w-2 h-2 bg-accent rounded-full animate-bounce [animation-delay:0.2s]"></span>
                    <span class="w-2 h-2 bg-accent rounded-full animate-bounce [animation-delay:0.4s]"></span>
                </div>
            `;
            chatContainer.appendChild(wrapper);
            chatContainer.scrollTop = chatContainer.scrollHeight;
            return id;
        }

        function escapeHtml(unsafe) {
            return unsafe
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }
    </script>
</body>
</html>
